{% extends "base.html" %}{% block titolo %}{{ a.tipo }}{% endblock %}
{% block corpo %}
<h1>{{ a.tipo }} {{ a.giornata }}</h1><p><a href="/pratiche/{{ p.id }}">← {{ p.codice }}</a>{% if a.generato_da_ai %} · <b>bozza generata dall'AI: da rivedere e completare prima della firma</b>{% endif %}</p>
<form method="post" action="/pratiche/{{ p.id }}/atto/{{ a.id }}" class="card">
<input type="hidden" name="csrf" value="{{ csrf }}">
<textarea name="testo" class="alta">{{ testo }}</textarea>
<p><button>Salva modifiche</button></p></form>{% endblock %}
