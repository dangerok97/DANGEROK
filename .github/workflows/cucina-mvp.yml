name: Cucina MVP regression

on:
  push:
    branches: [staging/cloud]
    paths:
      - "backend/recipes/**"
      - "backend/recipes/tests/test_*.py"
      - "frontend/src/recipes/**"
      - "frontend/app/(tabs)/cucina.tsx"
      - "frontend/e2e/cucina.spec.ts"
      - "frontend/e2e/cucina-qa.config.ts"
      - ".github/workflows/cucina-mvp.yml"
  pull_request:
    paths:
      - "backend/recipes/**"
      - "backend/recipes/tests/test_*.py"
      - "frontend/src/recipes/**"
      - "frontend/app/(tabs)/cucina.tsx"
      - ".github/workflows/cucina-mvp.yml"

permissions:
  contents: read

jobs:
  cucina-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test requirements
        run: |
          python -m pip install "pydantic==2.13.4" "pymongo==4.6.3" "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-xdist==3.8.0"
      - name: Compile and test recipes
        working-directory: backend
        run: |
          python -m compileall -q recipes
          pytest -n 0 recipes/tests/test_parser.py recipes/tests/test_service.py

  cucina-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: same-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-mobile-qa
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=e2e/cucina-qa.config.ts
