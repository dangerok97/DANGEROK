name: Cucina MVP regression

on:
  push:
    branches: [staging/cloud]
    paths:
      - "backend/recipes/**"
      - "backend/tests/test_recipes_*.py"
      - "frontend/src/recipes/**"
      - "frontend/app/(tabs)/cucina.tsx"
      - ".github/workflows/cucina-mvp.yml"
  pull_request:
    paths:
      - "backend/recipes/**"
      - "backend/tests/test_recipes_*.py"
      - "frontend/src/recipes/**"
      - "frontend/app/(tabs)/cucina.tsx"
      - ".github/workflows/cucina-mvp.yml"

permissions:
  contents: read

jobs:
  cucina-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test requirements
        run: |
          python -m pip install "pydantic==2.13.4" "pymongo==4.6.3" "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-xdist==3.8.0"
      - name: Compile and test recipes
        working-directory: backend
        run: |
          python -m compileall -q recipes
          pytest -n 0 tests/test_recipes_parser.py tests/test_recipes_service.py
