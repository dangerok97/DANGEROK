name: Apply reviewed Situation v107 patch
on:
  push:
    branches: [fix/situation-local-clock-v107]
    paths: [.github/workflows/situation-v107-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed application patch on exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/situation-local-clock-v107"
          git fetch origin refs/heads/fix/situation-local-clock-v107
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python scripts/apply_situation_clock_v107.py
          python -m compileall -q backend/situations backend/conversation_engine/ai_core/loop.py backend/tests/test_situation_clock_v107.py
          node --experimental-strip-types frontend/src/components/ora/ora14.test.ts
          git diff --check
          git rm scripts/apply_situation_clock_v107.py
          git add backend/situations/clock.py backend/situations/followup.py backend/conversation_engine/ai_core/loop.py backend/conversation_engine/ai_core/prompt.py frontend/src/components/ora/OraCockpitContext.tsx frontend/src/components/ora/presence/knowledge.ts frontend/src/components/ora/ora14.test.ts frontend/e2e/mobile-conversation-v93.spec.ts
          git config user.name 'ORA maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: share local Situation clock across chat and card v107'
          git push origin HEAD:refs/heads/fix/situation-local-clock-v107
          git rev-parse HEAD
