name: Apply reviewed Situation v108 patch
on:
  push:
    branches: [fix/situation-useful-updates-v108]
    paths: [.github/workflows/apply-situation-v108.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply application changes only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/situation-useful-updates-v108"
          git fetch origin refs/heads/fix/situation-useful-updates-v108
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('scripts/situation-v108.patch.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1732b19d355413ac7d85ab8618ef36b6787551bfc35acd6197f907f0681e1224'
          pathlib.Path('/tmp/situation-v108.patch').write_bytes(patch)
          PY
          git apply --check /tmp/situation-v108.patch
          git apply /tmp/situation-v108.patch
          git diff --check
          python -m compileall -q backend/agent/situation_updates.py backend/agent/service.py backend/tests/test_situation_home_updates_v108.py
          git rm scripts/situation-v108.patch.b64
          git add backend/agent/service.py backend/agent/situation_updates.py backend/tests/test_situation_home_updates_v108.py frontend/src/api/client.ts frontend/src/components/home/v3/HomeSections.tsx frontend/src/components/home/v3/aggiornamenti.ts frontend/src/components/home/v3/agentWorkView.ts frontend/src/components/home/v3/agentWorkView.test.ts frontend/e2e/mobile-qa.config.ts frontend/e2e/home-situation-updates-v108.spec.ts
          git config user.name 'ORA maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: only useful proven Situation results become Home updates v108'
          git push origin HEAD:refs/heads/fix/situation-useful-updates-v108
