name: Integrate Situation v100 repair
on:
  push:
    branches: [fix/existing-situation-responsibility-v100]
    paths: [.github/workflows/situation-v100-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_situation_v100_isolated
      JWT_SECRET: ci-test-secret-not-for-prod
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-v100-ci
      CALENDAR_PROVIDER_MODE: fake
      GEMINI_API_KEY: ''
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Check branch lease and integrate reviewed anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/existing-situation-responsibility-v100"
          git fetch origin refs/heads/fix/existing-situation-responsibility-v100
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python scripts/apply_situation_v100.py
          git diff --check
          python -m compileall -q backend/situations backend/conversation_engine/ai_core
      - name: Install backend test dependencies
        run: |
          python -m pip install -r backend/requirements-cloud.txt
          python -m pip install mongomock-motor==0.0.36
          mkdir -p /tmp/ora-v100-ci
      - name: Replay existing-Situation recovery and prior regressions
        working-directory: backend
        run: python -m pytest -q tests/test_situation_followup_turn_v100.py tests/test_situation_followup_loop_v98.py tests/test_situation_followup_v98.py tests/test_conversation_situation_autonomy_v58.py tests/test_life_outcome_watch_v84.py tests/test_immediate_situation_action_v88b.py -x
      - name: Commit only application changes after tests pass
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_situation_v100.py
          git add backend/conversation_engine/ai_core/models.py backend/conversation_engine/ai_core/governance.py backend/conversation_engine/ai_core/prompt.py backend/conversation_engine/ai_core/loop.py
          git config user.name 'ORA maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce follow-up responsibility on existing Situation turns v100'
          git push origin HEAD:refs/heads/fix/existing-situation-responsibility-v100
          git rev-parse HEAD
