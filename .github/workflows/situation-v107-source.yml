name: Situation v107 source audit
on:
  push:
    branches: [fix/situation-local-clock-v107]
    paths: [.github/workflows/situation-v107-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c67611d2a5ac035508c4f1da5136e1a86826aa0
          persist-credentials: false
      - name: Export pinned tracked application source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD backend frontend .github | gzip > ora-v107-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ora-v107-source
          path: ora-v107-source.tar.gz
          retention-days: 1
