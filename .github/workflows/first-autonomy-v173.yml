name: First autonomy v173 acceptance
on:
  push:
    branches: [ora/v173-first-autonomy-acceptance-20261014]
    paths:
      - .github/workflows/first-autonomy-v173.yml
      - backend/connected/core_work.py
      - backend/conversation_engine/ai_core/source_activation.py
      - backend/conversation_engine/ai_core/loop.py
      - backend/tests/test_source_entry_contract_v166.py
      - backend/conversation_engine/ai_core/loop.py
      - backend/tests/test_source_entry_contract_v166.py
      - backend/conversation_engine/ai_core/tools/calendar_caps.py
      - backend/home/manual_event.py
      - backend/tests/test_first_autonomy_v173.py
      - backend/scripts/first_autonomy_live_v173.py
  pull_request:
    paths:
      - .github/workflows/first-autonomy-v173.yml
      - backend/connected/core_work.py
      - backend/conversation_engine/ai_core/source_activation.py
      - backend/conversation_engine/ai_core/tools/calendar_caps.py
      - backend/home/manual_event.py
      - backend/tests/test_first_autonomy_v173.py
      - backend/scripts/first_autonomy_live_v173.py
permissions:
  contents: read
jobs:
  first-autonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_first_autonomy_v173_ci
      JWT_SECRET: ci-first-autonomy-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-first-autonomy-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
      ORA_SOURCE_MODEL_CONTRACT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing requirements
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-first-autonomy-docs
      - name: Compile and self-test live oracle
        working-directory: backend
        run: |
          python -m compileall -q connected/core_work.py conversation_engine/ai_core/source_activation.py conversation_engine/ai_core/tools/calendar_caps.py home/manual_event.py scripts/first_autonomy_live_v173.py
          python -m scripts.first_autonomy_live_v173
      - name: First autonomy invariants and selected regressions
        working-directory: backend
        run: |
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/first-autonomy-tests.xml             tests/test_first_autonomy_v173.py             tests/test_source_entry_contract_v166.py             tests/test_durable_source_work_v169.py             tests/test_general_source_core_v166.py             tests/test_ora_native_calendar_v155.py             tests/test_calendar_target_integrity_v157.py             tests/test_source_result_delivery_v170.py             tests/test_source_result_delivery_edges_v170.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-autonomy-v173-evidence
          path: /tmp/first-autonomy-tests.xml
          retention-days: 7
