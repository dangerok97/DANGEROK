name: Source persistence integrity
on:
  push:
    branches: [ora/v168-source-integrity-20261014]
    paths:
      - .github/workflows/source-integrity-v168.yml
      - backend/connected/signals.py
      - backend/tests/test_source_integrity_v168.py
      - backend/tests/test_source_real_recovery_v168.py
  pull_request:
    paths:
      - .github/workflows/source-integrity-v168.yml
      - backend/connected/signals.py
      - backend/tests/test_source_integrity_v168.py
      - backend/tests/test_source_real_recovery_v168.py
permissions:
  contents: read
concurrency:
  group: source-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_source_integrity_ci
      JWT_SECRET: ci-source-integrity-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-source-integrity-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
      ORA_SOURCE_MODEL_CONTRACT: ''
      ORA_SOURCE_REAL_DB_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing requirements
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-source-integrity-docs
      - name: Test identity, write failures, eight real clients and process restart
        working-directory: backend
        run: python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/source-integrity-tests.xml tests/test_source_integrity_v168.py tests/test_source_real_recovery_v168.py
      - name: Existing connected-source and shared-Core regressions
        if: success() || failure()
        working-directory: backend
        run: |
          # These tests bypass server startup. Match its normal queue-index setup
          # instead of depending on a different test file having run first.
          python - <<'PY'
          import asyncio, os
          from motor.motor_asyncio import AsyncIOMotorClient
          from ambient.repository import AmbientRepository
          async def setup():
              assert os.environ['MONGO_URL'] == 'mongodb://127.0.0.1:27017'
              assert os.environ['DB_NAME'] == 'ora_source_integrity_ci'
              client = AsyncIOMotorClient(os.environ['MONGO_URL'], serverSelectionTimeoutMS=5000)
              try:
                  db = client[os.environ['DB_NAME']]
                  await AmbientRepository(db).ensure_indexes()
                  indexes = await db.ambient_wakes.index_information()
                  assert any(v.get('unique') and v['key'] == [('identity', 1)] for v in indexes.values())
              finally:
                  client.close()
          asyncio.run(setup())
          PY
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/source-existing-tests.xml tests/test_connected_life_v310.py tests/test_email_agent_bridge_v310.py tests/test_cross_source_life_linking_v310.py tests/test_autonomy_continuity_v4.py tests/test_agent_memory_source_fence_v162.py tests/test_general_source_core_v166.py tests/test_source_entry_contract_v166.py tests/test_model_contract_v167.py
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-integrity-evidence
          path: /tmp/source-*-tests.xml
          retention-days: 7
