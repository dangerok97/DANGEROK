name: Frontend dependency remediation

on:
  push:
    branches: ["fix/frontend-production-deps"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update compatible production transitive dependencies
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --omit=dev
          audit_code=$?
          set -e
          echo "npm audit fix exit: $audit_code"
      - name: Commit lockfile remediation
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No compatible lockfile remediation available"
            exit 0
          fi
          git config user.name "ORA CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix: update compatible frontend transitive dependencies"
          git push origin HEAD:fix/frontend-production-deps
