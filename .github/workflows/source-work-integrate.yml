name: Durable source work integration
on:
  push:
    branches: [ora/v169-durable-source-work-20261014]
    paths:
      - .github/workflows/source-work-integrate.yml
      - backend/connected/core_work.py
      - backend/tests/test_durable_source_work_v169.py
permissions:
  contents: write
concurrency:
  group: source-work-integration
  cancel-in-progress: true
jobs:
  test:
    if: github.repository == 'dangerok97/DANGEROK'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_source_work_ci
      JWT_SECRET: ci-source-work-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-source-work-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
      ORA_SOURCE_MODEL_CONTRACT: ''
      ORA_SOURCE_CORE_PILOT_OWNERS: ''
      ORA_CORE_COMPACT_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing dependencies
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-source-work-docs
      - name: Apply only the two reviewed lane hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          changes = {
              'backend/connected/service.py': (
                  '9751b63b1c126cbce5131dafb3c93e1ea08873e5',
                  '        pending = await self.signals.pending(owner_id, limit=limit)\n',
                  '        from connected.core_work import SourceCoreWorker, enabled_for\n'
                  '        if enabled_for(owner_id):\n'
                  '            return await SourceCoreWorker(self.db).process_pending(owner_id, limit=limit)\n'
                  '        pending = await self.signals.pending(owner_id, limit=limit)\n'),
              'backend/connected/signals.py': (
                  '035456b035f5fde49814dc3a38bd3076b3f89736',
                  "            {'owner_id': owner_id, 'status': 'pending', '_supersession_pending': {'$ne': True}},\n",
                  "            {'owner_id': owner_id, 'status': 'pending', '_supersession_pending': {'$ne': True},\n"
                  "             '_core_work.phase': {'$exists': False}},\n"),
          }
          for path, (sha, before, after) in changes.items():
              p = Path(path); raw = p.read_bytes(); text = raw.decode()
              actual = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if actual != sha:
                  assert text.count(after) == 1, path
                  continue
              assert text.count(before) == 1, path
              updated = text.replace(before, after)
              compile(updated, path, 'exec')
              p.write_text(updated)
          PY
      - name: Source-work and unchanged source/Core regressions
        working-directory: backend
        run: |
          python -m compileall -q connected
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/source-work-tests.xml tests/test_durable_source_work_v169.py tests/test_source_integrity_v168.py tests/test_general_source_core_v166.py tests/test_source_entry_contract_v166.py tests/test_model_contract_v167.py tests/test_ora_native_calendar_v155.py tests/test_calendar_target_integrity_v157.py tests/test_phase2_durable_home_outbox_v142.py tests/test_connected_life_v310.py
      - name: Package reviewed Python sources for inspection
        if: always()
        run: |
          python - <<'PY'
          import zipfile, subprocess
          with zipfile.ZipFile('/tmp/source-work-code.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','backend']).decode().splitlines():
                  if name.endswith('.py') or name.endswith('requirements-cloud.txt'):
                      z.write(name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-work-evidence
          path: /tmp/source-work-*
          retention-days: 7
      - name: Commit only tested hooks to the experimental branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ora/v169-durable-source-work-20261014
          git fetch origin ora/v169-durable-source-work-20261014
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'ORA test automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/connected/service.py backend/connected/signals.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(core): select one source-processing lane and fence previously claimed work'
            git push origin HEAD:refs/heads/ora/v169-durable-source-work-20261014
          fi
