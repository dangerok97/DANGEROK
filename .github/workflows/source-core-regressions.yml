name: General source Core regressions
on:
  pull_request:
    paths:
      - .github/workflows/source-core-regressions.yml
      - backend/connected/**
      - backend/connectors/gmail/**
      - backend/conversation_engine/ai_core/**
      - backend/llm/**
      - backend/tests/test_general_source_core_v166.py
      - backend/tests/test_source_entry_contract_v166.py
      - backend/tests/test_instruction_contract_v167.py
      - backend/tests/test_model_contract_v167.py
      - backend/scripts/source_core_live_v166.py
      - backend/scripts/source_core_contract_eval_v167.py
permissions:
  contents: read
jobs:
  source-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_source_core_ci
      JWT_SECRET: ci-source-core-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-source-ci-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      ORA_CORE_COMPACT_CONTRACT: '1'
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing dependencies
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-source-ci-docs
      - name: Test common Core, source policy and unchanged legacy fallback
        working-directory: backend
        run: |
          python -m compileall -q connected/source_read.py conversation_engine/ai_core connectors/gmail llm scripts/source_core_contract_eval_v167.py
          python -m scripts.source_core_contract_eval_v167
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/source-core-tests.xml tests/test_model_contract_v167.py tests/test_provider_failover_v34.py tests/test_llm_cooldown_and_deadline_v3132.py tests/test_instruction_contract_v167.py tests/test_source_entry_contract_v166.py tests/test_general_source_core_v166.py tests/test_ora_native_calendar_v155.py tests/test_calendar_target_integrity_v157.py tests/test_shipment_competency_v109.py tests/test_whatsapp_cloud_bridge_v1.py tests/test_whatsapp_capability_parity_v1.py tests/test_recurring_memo_v113.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-core-regression-evidence
          path: /tmp/source-core-tests.xml
          retention-days: 7
