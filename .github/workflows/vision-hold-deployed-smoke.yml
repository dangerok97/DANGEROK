name: Vision hold and X deployed check
on:
  push:
    branches: [qa/vision-held-close-20261011]
    paths: ['.github/workflows/vision-hold-deployed-smoke.yml', 'scripts/vision_hold_deployed_smoke.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: vision-hold-deployed-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse the existing public-domain test photograph
        uses: actions/download-artifact@v4
        with:
          name: vision-deployed-evidence
          run-id: 38154226246
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .vision-fixtures
      - name: Select local fixture without changing auth, API or AI calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/vision_hold_deployed_smoke.py')
          text = p.read_text()
          old = '''source = client.get("https://wsrv.nl/?" + urlencode({"url":origin, "w":960, "output":"jpg"}), follow_redirects=True)
                  source.raise_for_status()
                  with Image.open(io.BytesIO(source.content)) as image:'''
          new = '''source_bytes = Path(".vision-fixtures/remote-source.jpg").read_bytes()
                  with Image.open(io.BytesIO(source_bytes)) as image:'''
          assert old in text, 'Unexpected QA source; do not alter API behavior'
          assert Path('.vision-fixtures/remote-source.jpg').is_file()
          p.write_text(text.replace(old, new))
          PY
      - name: Install bounded browser check dependencies
        run: python -m pip install 'httpx==0.28.1' 'pillow==12.3.0' 'playwright==1.54.0'
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Test published UI and server with real AI
        run: python scripts/vision_hold_deployed_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-hold-deployed-evidence
          path: .vision-hold-deployed/
          include-hidden-files: true
          retention-days: 7
