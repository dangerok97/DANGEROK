name: Wardrobe pilot tests
on:
  pull_request:
    branches: ['staging/cloud']
    paths:
      - 'backend/wardrobe/**'
      - 'backend/cutout_worker.py'
      - 'backend/cutout_worker_download.py'
      - 'backend/Dockerfile.cutout-worker'
      - 'backend/cutout_worker_requirements.txt'
      - 'tests/test_cutout_worker.py'
      - 'backend/routers/__init__.py'
      - 'frontend/src/wardrobe/**'
      - 'frontend/src/life-setup/GuidedSetupScreen.tsx'
      - 'frontend/app/(tabs)/**'
      - 'tests/test_wardrobe_v1.py'
      - 'frontend/e2e/wardrobe-pilot.spec.ts'
      - 'frontend/e2e/wardrobe-qa.config.ts'
      - '.github/workflows/wardrobe-pilot-tests.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - run: python -m pip install -r backend/requirements-cloud.txt
      - run: python -m compileall -q backend/wardrobe backend/routers/__init__.py backend/cutout_worker.py backend/cutout_worker_download.py
      - run: python -m pytest -q tests/test_wardrobe_v1.py tests/test_cutout_worker.py -ra
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-mobile-qa
        env:
          EXPO_PUBLIC_BACKEND_URL: same-origin
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=e2e/wardrobe-qa.config.ts
        env:
          EXPO_PUBLIC_BACKEND_URL: same-origin

  cutout-worker-smoke:
    name: Cutout model integrity and ONNX runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated cutout image with SHA-256 verified model
        run: docker build --pull --file backend/Dockerfile.cutout-worker --tag ora-cutout-test backend
      - name: Exercise pinned ONNX network on synthetic input, no image upload
        run: |
          docker run --rm --entrypoint python ora-cutout-test -c "import numpy as np; from cutout_worker import _load_session; s=_load_session(); x=np.zeros((1,3,320,320), dtype=np.float32); p=s.run(None,{s.get_inputs()[0].name:x}); assert p[0].shape[0:2]==(1,1); print('u2netp model SHA verified and inference succeeded')"
