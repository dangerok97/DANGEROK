name: Wardrobe pilot tests
on:
  pull_request:
    branches: ['staging/cloud']
    paths:
      - 'backend/wardrobe/**'
      - 'backend/routers/__init__.py'
      - 'frontend/src/wardrobe/**'
      - 'frontend/src/life-setup/GuidedSetupScreen.tsx'
      - 'frontend/app/(tabs)/**'
      - 'tests/test_wardrobe_v1.py'
      - 'tests/test_wardrobe_cutout_core.py'
      - 'frontend/e2e/wardrobe-pilot.spec.ts'
      - 'frontend/e2e/wardrobe-qa.config.ts'
      - '.github/workflows/wardrobe-pilot-tests.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - run: python -m pip install -r backend/requirements-cloud.txt
      - run: python -m compileall -q backend/wardrobe backend/routers/__init__.py
      - run: python -m pytest -q tests/test_wardrobe_v1.py tests/test_wardrobe_cutout_core.py -ra
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-mobile-qa
        env:
          EXPO_PUBLIC_BACKEND_URL: same-origin
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=e2e/wardrobe-qa.config.ts
        env:
          EXPO_PUBLIC_BACKEND_URL: same-origin
