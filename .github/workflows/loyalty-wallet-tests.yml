name: Loyalty wallet tests
on:
  push:
    branches: ['feat/ora-loyalty-wallet-v1', 'staging/cloud']
  pull_request:
    branches: ['staging/cloud']
permissions:
  contents: read
concurrency:
  group: loyalty-wallet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements-cloud.txt
      - name: Require real barcode engine (never silently skip in CI)
        run: python -c 'import zxingcpp; assert hasattr(zxingcpp, "create_barcode")'
      - name: Compile wallet modules
        run: python -m compileall -q backend/loyalty_wallet.py backend/routers/loyalty_wallet.py
      - name: Wallet HTTP privacy concurrency and exact code round-trips
        run: python -m pytest -q tests/test_loyalty_wallet*.py -ra
      - name: Prepare codec for isolated local photo validation
        run: |
          mkdir -p /tmp/ora-wallet-local
          python -m pip download --only-binary=:all: --no-deps zxing-cpp==3.1.1 -d /tmp/ora-wallet-local
          cp backend/loyalty_wallet.py /tmp/ora-wallet-local/
          printf '%s\n' "$GITHUB_SHA" > /tmp/ora-wallet-local/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-local-validation
          path: /tmp/ora-wallet-local/
          retention-days: 1
  wallet-ui:
    name: Wallet mobile and desktop (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      EXPO_PUBLIC_BACKEND_URL: same-origin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck actual components
        run: npx tsc --noEmit
      - name: Equivalent-code and preview security regressions
        run: node --experimental-strip-types --test src/wallet/scanCandidates.test.ts
      - name: Export production web UI
        run: npx expo export --platform web --output-dir dist-mobile-qa
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test wallet photo import cashier and VITA discovery
        run: npx playwright test --config=e2e/wallet-qa.config.ts
      - name: Retain synthetic-data screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loyalty-wallet-ui
          path: |
            frontend/mobile-qa/
            frontend/test-results/
          retention-days: 3
          if-no-files-found: warn
