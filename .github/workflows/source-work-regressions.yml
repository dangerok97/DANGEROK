name: Durable source work regressions
on:
  pull_request:
    paths:
      - .github/workflows/source-work-regressions.yml
      - backend/connected/**
      - backend/conversation_engine/ai_core/**
      - backend/tests/test_durable_source_work_v169.py
      - backend/tests/test_source_work_database_v169.py
      - backend/tests/test_source_work_races_v169.py
permissions:
  contents: read
jobs:
  source-work:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_source_work_ci
      JWT_SECRET: ci-source-work-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-source-work-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
      ORA_SOURCE_MODEL_CONTRACT: ''
      ORA_SOURCE_CORE_PILOT_OWNERS: ''
      ORA_SOURCE_REAL_DB_TEST: '1'
      ORA_CORE_COMPACT_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing dependencies
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-source-work-docs
      - name: Test complete source path, actual process exits and existing contracts
        working-directory: backend
        run: |
          python -m compileall -q connected
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/source-work-final.xml tests/test_durable_source_work_v169.py tests/test_source_work_database_v169.py tests/test_source_work_races_v169.py tests/test_source_integrity_v168.py tests/test_source_real_recovery_v168.py tests/test_general_source_core_v166.py tests/test_source_entry_contract_v166.py tests/test_model_contract_v167.py tests/test_instruction_contract_v167.py tests/test_provider_failover_v34.py tests/test_llm_cooldown_and_deadline_v3132.py tests/test_ora_native_calendar_v155.py tests/test_calendar_target_integrity_v157.py tests/test_phase2_durable_home_outbox_v142.py tests/test_connected_life_v310.py tests/test_shipment_competency_v109.py tests/test_whatsapp_cloud_bridge_v1.py tests/test_whatsapp_capability_parity_v1.py tests/test_recurring_memo_v113.py
      - name: Record exact code and test scope
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('/tmp/source-work-manifest.json').write_text(json.dumps({
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'pr_head_sha': '${{ github.event.pull_request.head.sha }}',
              'real_mongo': True, 'scripted_model_decisions': True,
              'personal_account_used': False, 'push_delivery_tested': False,
              'production_pilot_enabled': False,
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-work-final-evidence
          path: |
            /tmp/source-work-final.xml
            /tmp/source-work-manifest.json
          retention-days: 7
