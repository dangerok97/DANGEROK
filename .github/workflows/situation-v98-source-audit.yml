name: Situation v98 source audit
on:
  push:
    branches: [fix/situation-watch-contract-v98]
    paths: [.github/workflows/situation-v98-source-audit.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked application source only
        run: git archive --format=tar babd836ff9c999b2b886d18fba70c9652322c604 backend frontend .github | gzip > ora-v98-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ora-v98-source
          path: ora-v98-source.tar.gz
          retention-days: 1
