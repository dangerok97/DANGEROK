name: Situation follow-up regressions
on:
  push:
    branches: ['**']
    paths:
      - 'backend/situations/**'
      - 'backend/shipping/**'
      - 'backend/agent/**'
      - 'backend/ambient/**'
      - 'backend/delivery/**'
      - 'backend/conversation_engine/ai_core/**'
      - 'backend/life_profile/knowledge_map.py'
      - 'backend/tests/test_stale_actionable_needs_v1.py'
      - 'backend/tests/test_situation_create_declaration_recovery_v1.py'
      - 'backend/tests/test_situation_followup*'
      - 'backend/tests/test_situation_initial_admission_v157.py'
      - 'backend/tests/test_situation_admission_integrity_v157.py'
      - 'backend/tests/test_situation_runtime_integrity_v157.py'
      - 'backend/tests/test_situation_wait_integrity_v157.py'
      - 'backend/tests/test_situation_research_integrity_v159.py'
      - 'backend/tests/test_situation_*_v160.py'
      - 'backend/tests/test_map_focus_v114.py'
      - 'backend/tests/test_recurring_memo_v113.py'
      - 'backend/tests/test_situation_source_answer_v112.py'
      - 'backend/tests/test_situation_clock_v107.py'
      - 'frontend/src/components/ora/**'
      - '.github/workflows/situation-followup-regressions.yml'
  pull_request:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: situation-followup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  persistence:
    name: Situation checkpoint persistence and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_situation_ci
      JWT_SECRET: ci-test-secret-not-for-prod
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-situation-ci
      CALENDAR_PROVIDER_MODE: fake
      GEMINI_API_KEY: ''
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements-cloud.txt
          python -m pip install mongomock-motor==0.0.36
          mkdir -p /tmp/ora-situation-ci
      - name: Exercise persisted checkpoints, isolation, recovery and cancellation
        working-directory: backend
        run: python -m pytest -q tests/test_stale_actionable_needs_v1.py tests/test_situation_create_declaration_recovery_v1.py tests/test_situation_initial_admission_v157.py tests/test_map_focus_v114.py tests/test_recurring_memo_v113.py tests/test_situation_source_answer_v112.py tests/test_shipment_competency_v109.py tests/test_situation_clock_v107.py tests/test_situation_schedule_time_v106.py tests/test_temporary_situation_memory_guard_v105.py tests/test_situation_outcome_lifecycle_v102.py tests/test_situation_followup_recovery_v101.py tests/test_situation_followup_turn_v100.py tests/test_situation_followup_v98.py tests/test_situation_followup_loop_v98.py tests/test_conversation_situation_autonomy_v58.py tests/test_life_outcome_watch_v84.py tests/test_immediate_situation_action_v88b.py -x
      - name: Initial admission race, cancellation readback and source revision
        working-directory: backend
        run: python -m pytest -q -n 0 tests/test_situation_admission_integrity_v157.py tests/test_situation_runtime_integrity_v157.py tests/test_situation_wait_integrity_v157.py tests/test_situation_research_integrity_v159.py -x
      - name: Useful outcome, current weather, final result delivery and closure
        working-directory: backend
        run: python -m pytest -q -n 0 tests/test_situation_useful_outcome_v160.py tests/test_situation_weather_clock_v160.py tests/test_situation_outcome_delivery_v160.py tests/test_situation_outcome_visibility_v160.py tests/test_situation_completion_response_v160.py tests/test_situation_outcome_projection_v160.py -x
  presentation:
    name: Situation follow-up presentation guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check conversation controls and absence of false active reminders
        working-directory: frontend
        run: node --experimental-strip-types src/components/ora/ora14.test.ts
      - name: Estimate, action, expiry and current source presentation
        working-directory: frontend
        run: node --experimental-strip-types --test src/components/ora/situationOutcome.test.ts
