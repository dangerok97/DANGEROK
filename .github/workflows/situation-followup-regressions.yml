name: Situation follow-up regressions
on:
  push:
    branches: ['**']
    paths:
      - 'backend/situations/**'
      - 'backend/agent/**'
      - 'backend/ambient/**'
      - 'backend/conversation_engine/ai_core/**'
      - 'backend/life_profile/knowledge_map.py'
      - 'backend/tests/test_situation_followup*'
      - 'backend/tests/test_situation_clock_v107.py'
      - 'frontend/src/components/ora/**'
      - '.github/workflows/situation-followup-regressions.yml'
  pull_request:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: situation-followup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  persistence:
    name: Situation checkpoint persistence and dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_situation_ci
      JWT_SECRET: ci-test-secret-not-for-prod
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-situation-ci
      CALENDAR_PROVIDER_MODE: fake
      GEMINI_API_KEY: ''
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements-cloud.txt
          python -m pip install mongomock-motor==0.0.36
          mkdir -p /tmp/ora-situation-ci
      - name: Exercise persisted checkpoints, isolation, recovery and cancellation
        working-directory: backend
        run: python -m pytest -q tests/test_situation_clock_v107.py tests/test_situation_schedule_time_v106.py tests/test_temporary_situation_memory_guard_v105.py tests/test_situation_outcome_lifecycle_v102.py tests/test_situation_followup_recovery_v101.py tests/test_situation_followup_turn_v100.py tests/test_situation_followup_v98.py tests/test_situation_followup_loop_v98.py tests/test_conversation_situation_autonomy_v58.py tests/test_life_outcome_watch_v84.py tests/test_immediate_situation_action_v88b.py -x
  presentation:
    name: Situation follow-up presentation guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check conversation controls and absence of false active reminders
        working-directory: frontend
        run: node --experimental-strip-types src/components/ora/ora14.test.ts
