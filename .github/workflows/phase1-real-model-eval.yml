name: ORA Phase 1 real-model evaluation

# Opt-in to this specific audit branch: never on the production branch,
# never periodic, and never on a pull_request with untrusted fork code.
on:
  push:
    branches:
      - "audit/phase1-real-ai-*"
    paths:
      - "backend/scripts/phase1_cognitive_live_eval.py"
      - "backend/tests/test_phase1_real_eval_runner_v125.py"
      - ".github/workflows/phase1-real-model-eval.yml"
      - "backend/conversation_engine/ai_core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-real-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    name: Real LLM - synthetic users and blocked external actions
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      CI: "true"
      DB_NAME: ora_phase1_synthetic_only
      # Imported ORA settings require a URI; no Mongo service is started or used.
      MONGO_URL: mongodb://127.0.0.1:27017
      JWT_SECRET: synthetic-eval-non-production
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-phase1-eval
      # Dedicated eval credentials have precedence. Existing repo-level
      # LLM credentials are also accepted when explicitly configured.
      GEMINI_API_KEY: ${{ secrets.ORA_EVAL_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.ORA_EVAL_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: "auto"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install locked ORA dependencies and mock Mongo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install mongomock-motor==0.0.36
          mkdir -p /tmp/ora-phase1-eval
      - name: CI diagnostic verifies the isolated executor
        run: |
          python -m pytest -q tests/test_phase1_real_eval_runner_v125.py -x
      - name: Determine live-model availability without revealing secrets
        id: configured
        shell: bash
        run: |
          if [ -n "${GEMINI_API_KEY}" ] || [ -n "${OPENAI_API_KEY}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "LIVE_MODEL_CONFIGURED=true"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "LIVE_MODEL_BLOCKED=no_repository_model_credential"
          fi
      - name: Execute real model against synthetic read-only tools
        if: steps.configured.outputs.enabled == 'true'
        timeout-minutes: 10
        run: |
          python -m scripts.phase1_cognitive_live_eval \
            --mode live --scenario all --max-steps 7 \
            --output /tmp/ora-phase1-eval/real-model.json
      - name: Preserve synthetic-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-real-model-synthetic-results
          path: /tmp/ora-phase1-eval/real-model.json
          if-no-files-found: ignore
          retention-days: 7
