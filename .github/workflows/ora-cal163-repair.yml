name: CAL163 isolated patch and regression
on:
  push:
    branches: [ora/v163-calendar-bound-confirmation-20261013]
    paths:
      - .github/workflows/ora-cal163-repair.yml
      - scripts/apply_calendar_assent_patch.py
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'dangerok97/DANGEROK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_cal163_patch_synthetic
      JWT_SECRET: ci-only-not-production
      AMBIENT_RUNTIME: '0'
      CALENDAR_PROVIDER_MODE: fake
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-cal163-documents
      RESEARCH_ENABLED: '0'
      BACKUP_ENABLED: '0'
      PUSH_PROVIDER: noop
      PYTHON_DOTENV_DISABLED: '1'
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Apply exact reviewed runtime changes
        run: python scripts/apply_calendar_assent_patch.py
      - name: Install dependencies
        run: |
          mkdir -p /tmp/ora-cal163-documents
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
      - name: Safety and native calendar regressions
        working-directory: backend
        run: |
          python -m compileall -q agent/calendar_assent.py agent/commanded.py home/calendar_event.py conversation_engine/ai_core/loop.py conversation_engine/ai_core/tools/calendar_caps.py
          python -m pytest -q -n 0 --tb=short tests/test_calendar_bound_confirmation_v163.py tests/test_ora_native_calendar_v155.py tests/test_calendar_home_month_consistency_v157.py tests/test_calendar_target_integrity_v157.py --junitxml=/tmp/cal163-regression.xml
      - name: Save evidence and modified files
        if: always()
        run: |
          mkdir -p /tmp/cal163-patch
          git diff --binary > /tmp/cal163-patch/changes.patch
          cp /tmp/cal163-regression.xml /tmp/cal163-patch/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal163-patch-evidence
          path: /tmp/cal163-patch
          retention-days: 7
      - name: Commit tested changes only to the dedicated branch
        run: |
          python - <<'PY'
          import os, subprocess
          expected = {'backend/agent/commanded.py','backend/home/calendar_event.py','backend/conversation_engine/ai_core/loop.py','backend/conversation_engine/ai_core/tools/calendar_caps.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == expected, changed
          branch='ora/v163-calendar-bound-confirmation-20261013'
          assert os.environ['GITHUB_REF'] == 'refs/heads/'+branch
          current=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert current == os.environ['GITHUB_SHA'], 'Branch moved; no overwrite'
          subprocess.run(['git','add',*sorted(expected)],check=True)
          subprocess.run(['git','-c','user.name=ORA test automation','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(calendar): bind natural confirmation to owned frozen event and stop same-turn retries'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
