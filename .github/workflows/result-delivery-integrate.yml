name: Verified result delivery integration
on:
  push:
    branches: [ora/v170-verified-result-delivery-20261014]
    paths:
      - .github/workflows/result-delivery-integrate.yml
      - scripts/apply_result_delivery_v170.py
      - scripts/refine_result_delivery_v170.py
      - backend/delivery/source_results.py
      - backend/delivery/source_result_review.py
      - backend/tests/test_source_result_delivery_v170.py
      - backend/tests/test_source_result_delivery_edges_v170.py
permissions:
  contents: write
concurrency:
  group: verified-result-delivery-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'dangerok97/DANGEROK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_result_delivery_ci
      JWT_SECRET: ci-result-delivery-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-result-delivery-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
      ORA_SOURCE_CORE_PILOT_OWNERS: ''
      ORA_SOURCE_RESULT_DELIVERY_OWNERS: ''
      ORA_SOURCE_MODEL_CONTRACT: ''
      ORA_SOURCE_REAL_DB_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing requirements
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-result-delivery-docs
      - name: Initialize ordinary application indexes in isolated test database
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, os
          from motor.motor_asyncio import AsyncIOMotorClient
          from ambient.repository import AmbientRepository
          from delivery.repository import DeliveryRepository
          async def initialize():
              assert os.environ['MONGO_URL'] == 'mongodb://127.0.0.1:27017'
              assert os.environ['DB_NAME'] == 'ora_result_delivery_ci'
              client = AsyncIOMotorClient(os.environ['MONGO_URL'])
              try:
                  db = client[os.environ['DB_NAME']]
                  await AmbientRepository(db).ensure_indexes()
                  await DeliveryRepository(db).ensure_indexes()
              finally:
                  client.close()
          asyncio.run(initialize())
          PY
      - name: Reproduce legacy test defects before any runtime change
        working-directory: backend
        run: |
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/result-delivery-baseline.xml tests/test_delivery_v38.py tests/test_whatsapp_alert_consent_v1.py || true
          python - <<'PY'
          import xml.etree.ElementTree as E
          root=E.parse('/tmp/result-delivery-baseline.xml').getroot()
          failures={t.attrib['name'] for t in root.iter('testcase') if t.find('failure') is not None}
          assert not list(root.iter('error'))
          assert failures == {'test_the_delivery_decision_is_one_judgement_not_another_pipeline', 'test_a_push_carries_its_own_reason_and_lands_where_it_is_about', 'test_channel_permission_is_not_tied_to_expo_push'}, failures
          print('LEGACY_BASELINE_EXPECTED_FAILURES', sorted(failures))
          PY
      - name: Apply exact reviewed integration hooks
        run: |
          python scripts/apply_result_delivery_v170.py
          python scripts/refine_result_delivery_v170.py
      - name: Test source-to-provider boundary and existing delivery
        working-directory: backend
        run: |
          python -m compileall -q delivery connected/core_work.py
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/result-delivery-tests.xml tests/test_source_result_delivery_v170.py tests/test_source_result_delivery_edges_v170.py tests/test_durable_source_work_v169.py tests/test_source_work_races_v169.py tests/test_source_work_database_v169.py tests/test_delivery_v38.py tests/test_proactive_delivery_recheck_v66.py tests/test_recurring_memo_delivery_v131.py tests/test_expo_receipt_audit_v132.py tests/test_whatsapp_alert_consent_v1.py
      - name: Preserve tests and reviewed hooks
        if: always()
        run: |
          git diff --binary > /tmp/result-delivery-hooks.patch
          python - <<'PY'
          import zipfile
          paths=['backend/delivery/source_results.py','backend/delivery/source_result_review.py','backend/delivery/service.py','backend/delivery/models.py','backend/delivery/admission.py','backend/connected/core_work.py','backend/tests/test_source_result_delivery_v170.py','backend/tests/test_source_result_delivery_edges_v170.py','backend/tests/test_delivery_v38.py','scripts/apply_result_delivery_v170.py','scripts/refine_result_delivery_v170.py']
          with zipfile.ZipFile('/tmp/result-delivery-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-delivery-integration-evidence
          path: /tmp/result-delivery-*
          retention-days: 7
      - name: Commit only tested hooks to this experimental branch
        run: |
          set -euo pipefail
          git fetch origin 'ora/v170-verified-result-delivery-20261014'
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'ORA test automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/delivery/models.py backend/delivery/service.py backend/delivery/admission.py backend/connected/core_work.py backend/delivery/source_results.py backend/tests/test_delivery_v38.py
          git commit -m 'feat(delivery): integrate canonical receipt delivery with one original judgement site'
          git push origin HEAD:refs/heads/ora/v170-verified-result-delivery-20261014
