name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current tree and full Git history
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_git_history.py

  backend:
    name: Backend (compileall + pytest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_ci
      JWT_SECRET: ci-test-secret-not-for-prod
      LIFE_SETUP_ENABLED: "1"
      AI_LIFE_STRATEGIST_ENABLED: "1"
      LIFE_DOCUMENT_UNDERSTANDING_ENABLED: "1"
      DOCUMENT_AI_ENABLED: "0"
      CALENDAR_PROVIDER_MODE: fake
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-ci-documents
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
      - name: Prepare writable document storage
        run: mkdir -p /tmp/ora-ci-documents
      - name: compileall
        working-directory: backend
        run: python -m compileall -q .
      - name: Vita profile, flow and state semantics
        working-directory: backend
        run: |
          python -m pip install mongomock-motor==0.0.36
          python -m pytest -q \
            tests/test_vita_autonomy_resume.py \
            tests/test_life_profile_v33.py \
            tests/test_vita_flow_v3213c.py \
            tests/test_vita_semantics_v3213d.py \
            tests/test_vita_state_semantics_v3213e.py
      - name: Focused pytest (AI docs + analysis versions + LE docs + V2)
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_analysis_versions.py \
            tests/test_ai_document_understanding.py \
            tests/test_documents_v2.py \
            ai_life_strategist/tests/test_life_experience_documents.py \
            --ignore=tests/test_intelligent_documents_real_verification.py \
            -x
      - name: Conversation presence isolation and lifecycle
        working-directory: backend
        run: python -m pytest -q tests/test_presence_activity.py -x
      - name: Knowledge stars, account identity and full-name telephone introductions
        working-directory: backend
        run: python -m pytest -q tests/test_knowledge_map.py tests/test_introduction_contract_v313.py -x
      - name: Voice lifecycle and phone recipient corrections
        working-directory: backend
        run: python -m pytest -q tests/test_voice_streaming.py tests/test_live_voice_fluidity.py tests/test_voice_output_v313.py tests/test_voice_life_continuity_v313.py tests/test_phone_identity_conflict.py tests/test_ai_first_skill_routing_v82.py -x
      - name: Continuous online market watch
        working-directory: backend
        run: python -m pytest -q tests/test_energy_offer_monitor.py -x
      - name: Accommodation provider contract
        working-directory: backend
        run: python -m pytest -q tests/test_accommodation_booking.py -x
      - name: Calendar departure freshness and background continuity
        working-directory: backend
        run: |
          python -m pytest -q tests/test_calendar_departures.py tests/test_arrival_departure_advice.py tests/test_background_departure_origin_v67.py \
            tests/test_home_overlap_opportunity.py tests/test_scheduled_discovery_continuity.py -x
      - name: Autonomous work, clarification, source changes and scheduled recovery
        working-directory: backend
        run: |
          python -m pytest -q tests/test_autonomy_continuity_v4.py \
            tests/test_background_agent_loop.py tests/test_opportunity_admission_v4.py \
            tests/test_admission_source_context_v4.py tests/test_agent_preparation_v4.py \
            tests/test_agent_pending_steps_v4.py tests/test_autonomous_document_cycle_v4.py \
            tests/test_routine_autonomy_v40.py tests/test_routine_proactive_wakes_v41.py \
            tests/test_routine_route_context_v42.py tests/test_routine_user_control_v43.py \
            tests/test_agent_context_reads_v44.py tests/test_agent_ephemeral_mail_v45.py \
            tests/test_linked_situation_propagation_v46.py tests/test_communication_delta_review_v47.py \
            tests/test_disagreement_actionable_calendar_v47.py tests/test_specific_authority_handoff_v48.py \
            tests/test_disagreement_source_refs_v49.py tests/test_planner_calendar_modify_v50.py \
            tests/test_prepared_effect_replanning_v50.py tests/test_generic_causal_propagation_v51.py \
            tests/test_agent_device_contacts_v52.py tests/test_agent_banking_context_v53.py \
            tests/test_native_presence_runtime_v54.py tests/test_autonomy_reality_gate_v55.py \
            tests/test_autonomous_external_followups_v56.py tests/test_external_reply_goal_resume_v57.py \
            tests/test_conversation_situation_autonomy_v58.py tests/test_agent_weather_context_v59.py \
            tests/test_pinned_place_weather_v60.py tests/test_ai_chosen_followup_timing_v60.py \
            tests/test_everyday_situation_weather_followup_v77.py \
            tests/test_everyday_situation_visibility_v78.py \
            tests/test_contract_renewal_reality_v80.py \
            tests/test_agent_situation_context_v61.py tests/test_canonical_place_situation_links_v62.py \
            tests/test_verified_situation_links_v63.py tests/test_local_time_followup_reasoning_v65.py tests/test_autonomous_live_route_v64.py tests/test_proactive_delivery_recheck_v66.py tests/test_ambient_agent_need_recheck_v70.py tests/test_post_run_visibility_budget_v69.py tests/test_exact_minute_followups_v68.py tests/test_user_controls_running_autonomy_v73.py tests/test_opportunity_agent_work_dedupe_v74.py \
            tests/test_document_extraction_signal_v4.py tests/test_update_work.py \
            tests/test_life_profile_opportunity_bridge.py \
            tests/test_ambient_runtime_v38.py tests/test_ambient_reliability_v38.py -x
          CONTINUITY_REAL_MONGO=1 python -m pytest -q tests/test_autonomy_continuity_v4.py -x
      - name: Gmail relevance attachments and connected-life bridge
        working-directory: backend
        run: |
          python -m pytest -q tests/test_email_connected_source_v310.py \
            tests/test_email_agent_bridge_v310.py tests/test_agent_gmail_send.py -x
      - name: Google first sync, cloud sessions, location privacy and polling
        working-directory: backend
        run: |
          python -m pytest -q tests/test_cloud_connection_sync.py tests/test_session_revocation_cloud.py \
            tests/test_weather_location_revocation.py \
            tests/test_connected_autosync_v310.py tests/test_autosync_starvation_v310.py
      - name: Public auth rate limits
        working-directory: backend
        run: python -m pytest -q tests/test_auth_rate_limit.py -x
      - name: Backup restore round trip
        working-directory: backend
        run: python -m pytest -q tests/test_backup_restore.py tests/test_backup_scheduler.py -x
      - name: Calendar command target, confirmation and timezone safety
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_agent_commanded_v39.py \
            tests/test_calendar_move_v310.py \
            -x
  telephone-cloud:
    name: Telephone cloud safety
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_ci_telephone
      JWT_SECRET: ci-telephone-secret
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-ci-telephone-documents
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
      - name: Prepare writable storage
        run: mkdir -p /tmp/ora-ci-telephone-documents
      - name: Telephone transport + live runtime + recovery
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_telephone_transport_v3131.py \
            tests/test_live_runtime_v313.py \
            tests/test_call_failure_recovery_v3212.py \
            tests/test_post_call_recovery_v322.py \
            tests/test_post_call_application_v315.py \
            tests/test_mission_preparation_v3201.py \
            tests/test_contact_trust_v3201_final.py \
            tests/test_phone_identity_conflict.py \
            -x

  frontend-tsc:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: tsc
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Auth provider regressions
        working-directory: frontend
        run: npm run test:auth
      - name: Device location consent and native background presence
        working-directory: frontend
        run: node --test src/location/shareForeground.test.cjs src/location/presenceTask.test.cjs
      - name: Resolve Expo iOS configuration
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://ora-backend-production-aa56.up.railway.app
        run: npx expo config --type public >/tmp/ora-expo-ios-config.json
      - name: Generate native iOS project
        working-directory: frontend
        env:
          EXPO_NO_GIT_STATUS: "1"
          EXPO_PUBLIC_BACKEND_URL: https://ora-backend-production-aa56.up.railway.app
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Export production iOS bundle
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://ora-backend-production-aa56.up.railway.app
        run: npx expo export --platform ios --output-dir /tmp/ora-ios-export

  frontend-product-guards:
    name: Frontend product guards (current Vita)
    runs-on: ubuntu-latest
    needs: [backend, frontend-tsc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Current product guards
        working-directory: frontend
        run: |
          npm run test:home3
          npm run test:v3213b
          npm run test:v3213c
          npm run test:v3213d
          npm run test:v3213e
          npm run test:v322
          node --test --experimental-strip-types src/components/ora/presence/presence.test.ts src/components/ora/presence/openingSession.test.ts src/components/ora/presence/scene.test.mjs src/ora/openingHandoff.test.ts src/voice/voice313.test.ts src/voice/voiceRuntime.test.ts src/components/ora/ora14.test.ts src/components/ora/navigationConfirmation.test.ts src/location/backgroundDepartureOrigin.test.ts src/life-setup/vitaLoading.test.ts src/life-setup/registrationIntro.test.ts src/components/vita/routinesPlaces.test.ts src/components/vita/mapPickerViewport.test.ts src/components/vita/googleMapsOnly.test.ts src/components/vita/placeEditorLocationLookup.test.ts src/contacts/deviceContacts.test.ts

      # The former life-experience-documents Playwright spec is intentionally
      # not a blocking CI gate here. It navigates the pre-V3.21 greedy
      # skip-domain flow until a document recommendation appears; Vita is now
      # area/gap-driven. Keep the spec in-repo as legacy coverage until it is
      # rewritten against the current product flow. Do not mark that legacy
      # behavior as a product regression merely to make CI green.
