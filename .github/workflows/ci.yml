name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          # Match real PEM headers, not harmless test assertions mentioning the phrase.
          if git grep -nE -- '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- . \
            ':(exclude)*.md' ':(exclude)*/e2e-evidence/*' ':(exclude)*/node_modules/*'; then
            echo "Private key material found in repo" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "Tracked .env file(s) detected" >&2
            exit 1
          fi
          echo "Secret scan OK"

  backend:
    name: Backend (compileall + pytest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_ci
      JWT_SECRET: ci-test-secret-not-for-prod
      LIFE_SETUP_ENABLED: "1"
      AI_LIFE_STRATEGIST_ENABLED: "1"
      LIFE_DOCUMENT_UNDERSTANDING_ENABLED: "1"
      DOCUMENT_AI_ENABLED: "0"
      CALENDAR_PROVIDER_MODE: fake
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
      - name: compileall
        working-directory: backend
        run: python -m compileall -q .
      - name: Focused pytest (AI docs + analysis versions + LE docs + V2)
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_analysis_versions.py \
            tests/test_ai_document_understanding.py \
            tests/test_documents_v2.py \
            ai_life_strategist/tests/test_life_experience_documents.py \
            --ignore=tests/test_intelligent_documents_real_verification.py \
            -x

  frontend-tsc:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: tsc
        working-directory: frontend
        run: npx tsc --noEmit

  playwright-web:
    name: Playwright (Life Experience docs)
    runs-on: ubuntu-latest
    needs: [backend, frontend-tsc]
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_ci_e2e
      JWT_SECRET: ci-e2e-secret
      LIFE_SETUP_ENABLED: "1"
      AI_LIFE_STRATEGIST_ENABLED: "1"
      LIFE_DOCUMENT_UNDERSTANDING_ENABLED: "1"
      DOCUMENT_AI_ENABLED: "0"
      CALENDAR_PROVIDER_MODE: fake
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/ora-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/ >/dev/null; then echo ready; exit 0; fi
            sleep 2
          done
          echo "Backend failed to start" >&2
          cat /tmp/ora-api.log || true
          exit 1
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start Expo web
        working-directory: frontend
        run: |
          nohup npm run web -- --port 8081 > /tmp/ora-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081 >/dev/null; then echo web ready; exit 0; fi
            sleep 3
          done
          echo "Expo web failed" >&2
          cat /tmp/ora-web.log || true
          exit 1
      - name: Playwright life-experience-documents
        working-directory: frontend
        run: npx playwright test e2e/life-experience-documents.spec.ts --project=chromium
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-life-docs
          path: frontend/e2e-evidence/life-experience-documents/
          if-no-files-found: ignore
