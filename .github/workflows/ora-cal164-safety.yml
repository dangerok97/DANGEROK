name: CAL164 native calendar regression
on:
  pull_request:
    paths:
      - .github/workflows/ora-cal164-safety.yml
      - backend/home/manual_event.py
      - backend/agent/calendar_assent.py
      - backend/conversation_engine/ai_core/**
      - backend/tests/test_calendar_repeat_and_dates_v164.py
      - backend/scripts/calendar_conflict_read_v164.py
permissions:
  contents: read
jobs:
  calendar-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_cal164_synthetic_only
      JWT_SECRET: ci-only-not-production
      AMBIENT_RUNTIME: '0'
      CALENDAR_PROVIDER_MODE: fake
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-cal164-documents
      RESEARCH_ENABLED: '0'
      BACKUP_ENABLED: '0'
      PUSH_PROVIDER: noop
      PYTHON_DOTENV_DISABLED: '1'
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install isolated test dependencies
        run: |
          mkdir -p /tmp/ora-cal164-documents
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
      - name: Native writes, dates, authority and cross-skill regressions
        working-directory: backend
        run: |
          python -m compileall -q home/manual_event.py conversation_engine/ai_core/grounding/calendar_weekday.py conversation_engine/ai_core/loop.py conversation_engine/ai_core/tools/calendar_caps.py scripts/calendar_conflict_read_v164.py
          python -m scripts.calendar_conflict_read_v164
          python -m pytest -q -n 0 --disable-warnings --tb=short tests/test_calendar_repeat_and_dates_v164.py tests/test_calendar_bound_confirmation_v163.py tests/test_ora_native_calendar_v155.py tests/test_calendar_home_month_consistency_v157.py tests/test_calendar_target_integrity_v157.py tests/test_shipment_competency_v109.py tests/test_recurring_memo_v113.py tests/test_whatsapp_cloud_bridge_v1.py tests/test_financial_card_continuity_v158.py tests/test_situation_useful_outcome_v160.py --junitxml=/tmp/cal164-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal164-regression-results
          path: /tmp/cal164-regression.xml
          retention-days: 14
