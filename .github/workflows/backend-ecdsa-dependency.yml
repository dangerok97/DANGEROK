name: Backend ECDSA dependency trace

on:
  push:
    branches: ["audit/backend-ecdsa-dependency"]

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and dependency tree
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install pipdeptree
      - name: Trace ECDSA reverse dependencies
        working-directory: backend
        run: |
          pipdeptree --reverse --packages ecdsa
