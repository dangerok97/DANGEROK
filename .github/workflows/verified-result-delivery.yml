name: Verified result delivery regressions
on:
  pull_request:
    paths:
      - .github/workflows/verified-result-delivery.yml
      - backend/delivery/**
      - backend/connected/core_work.py
      - backend/tests/test_source_result_delivery*.py
      - backend/tests/test_autonomy_e2e_lane_v1.py
      - backend/tests/test_delivery_v38.py
permissions:
  contents: read
jobs:
  verified-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_result_delivery_ci
      JWT_SECRET: ci-result-delivery-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-result-delivery-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
      ORA_SOURCE_CORE_PILOT_OWNERS: ''
      ORA_SOURCE_RESULT_DELIVERY_OWNERS: ''
      ORA_SOURCE_MODEL_CONTRACT: ''
      ORA_SOURCE_REAL_DB_TEST: '1'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing requirements
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-result-delivery-docs
      - name: Initialize ordinary test database indexes
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, os
          from motor.motor_asyncio import AsyncIOMotorClient
          from ambient.repository import AmbientRepository
          from delivery.repository import DeliveryRepository
          async def initialize():
              assert os.environ['MONGO_URL'] == 'mongodb://127.0.0.1:27017'
              assert os.environ['DB_NAME'] == 'ora_result_delivery_ci'
              client = AsyncIOMotorClient(os.environ['MONGO_URL'])
              try:
                  db = client[os.environ['DB_NAME']]
                  await AmbientRepository(db).ensure_indexes()
                  await DeliveryRepository(db).ensure_indexes()
              finally:
                  client.close()
          asyncio.run(initialize())
          PY
      - name: Test actual source-to-provider pipeline and separate-process recovery
        working-directory: backend
        run: |
          python -m compileall -q delivery connected/core_work.py
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/result-delivery-final.xml tests/test_autonomy_e2e_lane_v1.py tests/test_source_result_delivery_v170.py tests/test_source_result_delivery_edges_v170.py tests/test_source_result_delivery_process_v170.py tests/test_durable_source_work_v169.py tests/test_source_work_races_v169.py tests/test_source_work_database_v169.py tests/test_delivery_v38.py tests/test_proactive_delivery_recheck_v66.py tests/test_recurring_memo_delivery_v131.py tests/test_expo_receipt_audit_v132.py tests/test_whatsapp_alert_consent_v1.py
      - name: Record exact tested revision and evidence scope
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as E
          result=pathlib.Path('/tmp/result-delivery-final.xml')
          suites=[n.attrib for n in E.parse(result).getroot().iter('testsuite')] if result.exists() else []
          data={'head_sha': os.environ['PR_HEAD_SHA'], 'test_sha': os.environ['GITHUB_SHA'],
                'suites': suites, 'real_model': False, 'real_personal_account': False,
                'provider': 'synthetic_in_memory_or_test_mongo', 'device_delivery_verified': False,
                'process_recovery_test_enabled': os.environ['ORA_SOURCE_REAL_DB_TEST'] == '1'}
          pathlib.Path('/tmp/result-delivery-manifest.json').write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-result-delivery-evidence
          path: /tmp/result-delivery-*
          retention-days: 7
