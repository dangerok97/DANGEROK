name: Source Core isolated integration
on:
  push:
    branches: [ora/v166-general-source-core-20261014]
    paths:
      - .github/workflows/source-core-integrate.yml
      - scripts/apply_source_core_v166.py
      - backend/tests/test_general_source_core_v166.py
permissions:
  contents: write
concurrency:
  group: source-core-isolated-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'dangerok97/DANGEROK'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_source_core_ci
      JWT_SECRET: ci-source-core-synthetic-only
      AMBIENT_RUNTIME: '0'
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-source-ci-docs
      CALENDAR_PROVIDER_MODE: fake
      PUSH_PROVIDER: noop
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install existing backend requirements
        run: |
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
          mkdir -p /tmp/ora-source-ci-docs
      - name: Apply exact reviewed hooks
        run: python scripts/apply_source_core_v166.py
      - name: Compile and test source entry, grants and ordinary channels
        working-directory: backend
        run: |
          python -m compileall -q connected/source_read.py conversation_engine/ai_core connectors/gmail
          python -m pytest -q -n 0 --tb=short --disable-warnings --junitxml=/tmp/source-core-tests.xml tests/test_general_source_core_v166.py tests/test_ora_native_calendar_v155.py tests/test_calendar_target_integrity_v157.py tests/test_shipment_competency_v109.py tests/test_whatsapp_cloud_bridge_v1.py tests/test_whatsapp_capability_parity_v1.py tests/test_recurring_memo_v113.py
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-core-regression-evidence
          path: /tmp/source-core-tests.xml
          retention-days: 7
      - name: Commit tested runtime only to this experimental branch
        run: |
          set -euo pipefail
          git fetch origin 'ora/v166-general-source-core-20261014'
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'ORA test automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/connectors/gmail/provider.py backend/connectors/gmail/service.py backend/conversation_engine/ai_core/tools/registry.py backend/conversation_engine/ai_core/state.py backend/conversation_engine/ai_core/loop.py
          git diff --cached --stat
          git commit -m 'feat(core): shared source trigger, bounded source tools and private context persistence'
          git push origin HEAD:refs/heads/ora/v166-general-source-core-20261014
