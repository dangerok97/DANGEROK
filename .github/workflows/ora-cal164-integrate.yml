name: CAL164 isolated integration
on:
  push:
    branches: [ora/v164-calendar-repeat-and-dates-20261014]
    paths:
      - .github/workflows/ora-cal164-integrate.yml
      - scripts/apply_cal164_patch.py
      - backend/tests/test_calendar_repeat_and_dates_v164.py
permissions:
  contents: write
jobs:
  verify-and-integrate:
    if: github.repository == 'dangerok97/DANGEROK'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ora_cal164_synthetic_only
      JWT_SECRET: ci-only-not-production
      AMBIENT_RUNTIME: '0'
      CALENDAR_PROVIDER_MODE: fake
      DOCUMENT_AI_ENABLED: '0'
      DOCUMENT_STORAGE_BACKEND: local
      DOCUMENT_STORAGE_DIR: /tmp/ora-cal164-documents
      RESEARCH_ENABLED: '0'
      BACKUP_ENABLED: '0'
      PUSH_PROVIDER: noop
      PYTHON_DOTENV_DISABLED: '1'
      GEMINI_API_KEY: ''
      GEMINI2_API_KEY: ''
      OPENAI_API_KEY: ''
      MISTRAL_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install isolated test dependencies
        run: |
          mkdir -p /tmp/ora-cal164-documents /tmp/cal164-evidence
          python -m pip install -q -r backend/requirements-cloud.txt mongomock-motor==0.0.36
      - name: Confirm unpatched source performs four writes instead of one
        working-directory: backend
        run: |
          set +e
          python -m pytest -q -n 0 --disable-warnings --tb=short tests/test_calendar_repeat_and_dates_v164.py::test_raw_repeated_update_does_not_write_again --junitxml=/tmp/cal164-evidence/baseline.xml
          result=$?
          set -e
          test "$result" -eq 1
          python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/cal164-evidence/baseline.xml"); f=r.findall(".//failure"); assert len(f)==1 and "assert 4 == 1" in (f[0].text or ""), "Baseline must reproduce actual duplicate writes, not an instrumentation error"'
      - name: Integrate SHA-fenced source changes
        run: python scripts/apply_cal164_patch.py
      - name: Calendar, consent and cross-skill safety
        working-directory: backend
        run: |
          python -m compileall -q home/manual_event.py conversation_engine/ai_core/grounding/calendar_weekday.py conversation_engine/ai_core/loop.py conversation_engine/ai_core/tools/calendar_caps.py
          python -m pytest -q -n 0 --disable-warnings --tb=short tests/test_calendar_repeat_and_dates_v164.py tests/test_calendar_bound_confirmation_v163.py tests/test_ora_native_calendar_v155.py tests/test_calendar_home_month_consistency_v157.py tests/test_calendar_target_integrity_v157.py tests/test_shipment_competency_v109.py tests/test_recurring_memo_v113.py tests/test_whatsapp_cloud_bridge_v1.py tests/test_financial_card_continuity_v158.py tests/test_situation_useful_outcome_v160.py --junitxml=/tmp/cal164-evidence/patched.xml
      - name: Save reviewed patch evidence
        if: always()
        run: git diff --binary > /tmp/cal164-evidence/runtime.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal164-integration-evidence
          path: /tmp/cal164-evidence
          retention-days: 14
      - name: Commit only tested runtime files to this isolated branch
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$(git ls-remote origin refs/heads/ora/v164-calendar-repeat-and-dates-20261014 | cut -f1)" = '${{ github.sha }}'
          git add backend/home/manual_event.py backend/conversation_engine/ai_core/loop.py backend/conversation_engine/ai_core/tools/calendar_caps.py
          git config user.name 'ORA test automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(calendar): avoid no-op writes and signals; ground explicit weekday in calendar dates'
          git push origin HEAD:refs/heads/ora/v164-calendar-repeat-and-dates-20261014
