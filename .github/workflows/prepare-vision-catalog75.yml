name: Prepare Vision catalog75
on:
  push:
    branches: [qa/vision-catalog75-prepare]
    paths: ['.github/workflows/prepare-vision-catalog75.yml']
permissions:
  contents: write
concurrency:
  group: prepare-vision-catalog75
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Clarify new bowl description without changing the old 25 models
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/vision-catalog-75
          test "$(git rev-parse FETCH_HEAD)" = "8e543d648a02b67c2df8beb929b56cc4e1b081a4"
          git switch -c polished-catalog75 FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/vision_catalog_extended/kitchen.py')
          s=p.read_text()
          old='Resta esterna al gruppo che ruota.'
          assert s.count(old)==1
          p.write_text(s.replace(old,'La ciotola resta ferma all’esterno del cestello che ruota e raccoglie le gocce espulse.',1))
          PY
          git diff --check
          git add backend/vision_catalog_extended/kitchen.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(vision): clarify stationary bowl versus rotating basket'
          git push origin HEAD:refs/heads/feat/vision-catalog-75
