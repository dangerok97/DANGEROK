name: V3.21.4 History Sanitization

on:
  push:
    branches:
      - staging/cloud

permissions:
  contents: write

concurrency:
  group: v3214-history-sanitization
  cancel-in-progress: false

jobs:
  sanitize:
    if: contains(github.event.head_commit.message, 'SANITIZE_HISTORY_ONCE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite all branch and tag history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bring every branch and tag into local refs so filter-repo rewrites
          # the whole reachable repository history, not just staging/cloud.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            sha="$(git rev-parse "$ref")"
            git update-ref "refs/heads/$branch" "$sha"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          python -m pip install --disable-pip-version-check --quiet git-filter-repo

          # Authorized destructive operation: remove ONLY legacy uploaded
          # document blobs from every reachable commit.
          git filter-repo --force --invert-paths --path backend/data/documents

          # filter-repo removes origin intentionally. Re-add it with the
          # ephemeral Actions token; the URL is never committed.
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout staging/cloud
          git commit --allow-empty -m "Mark V3.21.4 history sanitized"

          git push --force origin --all
          git push --force origin --tags

      - name: Verify remote history no longer exposes document storage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ora-history-verify.git
          git clone --mirror --quiet "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/ora-history-verify.git

          if git -C /tmp/ora-history-verify.git rev-list --objects --all |
             grep -qE ' backend/data/documents(/|$)'; then
            echo "HISTORY_SANITIZATION=FAIL legacy document path still reachable" >&2
            exit 1
          fi

          echo "HISTORY_SANITIZATION=PASS legacy document path absent from all advertised refs"
