name: Prepare Vision provider recovery
on:
  push:
    branches: [qa/vision-provider-recovery-prepare]
    paths: ['.github/workflows/prepare-vision-provider-recovery.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare feature source only
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/prepare_vision_provider_recovery.py /tmp/prepare_vision_provider_recovery.py
          git fetch origin fix/vision-provider-recovery-truth
          test "$(git rev-parse FETCH_HEAD)" = "864b60b0b28a2937e44a68a1163f9ac447b90f8f"
          git switch -c prepared-vision-provider-recovery FETCH_HEAD
          python /tmp/prepare_vision_provider_recovery.py
          python -m compileall -q backend/vision_xray.py backend/vision_catalog.py backend/vision_provider.py
          git diff --check
          git add backend/vision_xray.py backend/vision_catalog.py frontend/src/vision-xray/LiveExplorer.web.tsx frontend/src/vision-xray/catalogApi.ts frontend/src/vision-xray/visualStyle.ts frontend/playwright.vision.config.ts docs/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vision): separate provider outages from recognition and recover with verified hints'
          git push origin HEAD:refs/heads/fix/vision-provider-recovery-truth
