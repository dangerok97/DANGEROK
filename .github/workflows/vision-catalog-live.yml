name: Vision catalog and live camera
on:
  push:
    branches: [feat/ora-vision-xray]
  pull_request:
    branches: [staging/cloud]
    paths:
      - 'backend/vision*'
      - 'backend/vision_catalog_extended/**'
      - 'backend/vision_tests/**'
      - 'frontend/src/vision-xray/**'
      - 'frontend/e2e/vision-*.spec.ts'
      - 'frontend/playwright.vision.config.ts'
      - 'frontend/Dockerfile.staging'
      - 'frontend/nginx.staging.conf'
      - 'frontend/scripts/build-bodyparts3d.sh'
      - 'frontend/scripts/ora-bodyparts3d-*'
      - 'frontend/scripts/ora-anatomy-terminology-it.ts'
      - 'frontend/scripts/check-bodyparts3d-build.mjs'
      - 'frontend/app/vision-xray.tsx'
      - 'frontend/src/components/ora/OraAttachMenu.tsx'
      - '.github/workflows/vision-catalog-live.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: vision-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VISION_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install 'pydantic==2.13.4' 'fastapi==0.142.2' 'motor==3.3.1' 'pymongo==4.6.3' 'httpx==0.28.1' 'pillow==12.3.0' pytest pytest-asyncio uvicorn
      - name: Test real Mongo persistence and guarded API
        run: |
          set -o pipefail
          mkdir -p .vision-evidence
          python -m pytest -c /dev/null backend/vision_tests -q --junitxml=.vision-evidence/catalog-tests.xml | tee .vision-evidence/catalog-tests.txt
      - name: Archive focused source
        if: always()
        run: |
          mkdir -p .vision-evidence
          tar -czf .vision-evidence/vision-source.tar.gz backend/vision_catalog.py backend/vision_xray.py backend/vision_seed_library.py backend/vision_catalog_extended backend/vision_tests frontend/src/vision-xray frontend/app/vision-xray.tsx frontend/e2e/vision-*.spec.ts frontend/playwright.vision.config.ts scripts/vision_test_server.py
          git rev-parse HEAD > .vision-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-catalog-evidence
          path: .vision-evidence/
          include-hidden-files: true
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VISION_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      EXPO_PUBLIC_BACKEND_URL: same-origin
      ORA_SKIP_CMD_GUARD: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser harness dependencies
        run: python -m pip install 'pydantic==2.13.4' 'fastapi==0.142.2' 'motor==3.3.1' 'pymongo==4.6.3' 'httpx==0.28.1' 'pillow==12.3.0' uvicorn
      - name: Install app
        working-directory: frontend
        run: npm ci
      - name: Export exact procedural seeds for geometry tests
        run: |
          mkdir -p .vision-evidence
          PYTHONPATH=backend python -c 'import json;from vision_catalog import seeds;print(json.dumps([m.model_dump(mode="json") for m in seeds()]))' > .vision-evidence/seeds.json
      - name: Typecheck application
        working-directory: frontend
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee ../.vision-evidence/typecheck.txt
      - name: Geometry, gestures and attachment-menu regression tests
        working-directory: frontend
        run: |
          node --test src/vision-xray/*.test.mjs 2>&1 | tee ../.vision-evidence/geometry-tests.txt
          node --experimental-strip-types src/components/ora/attachMenu313.test.ts 2>&1 | tee ../.vision-evidence/attachment-tests.txt
      - name: Build actual Expo web application
        working-directory: frontend
        run: npx expo export --platform web --output-dir dist-vision 2>&1 | tee ../.vision-evidence/build.txt
      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Start isolated application harness
        run: |
          python scripts/vision_test_server.py > .vision-evidence/harness.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/api/health
      - name: Verify catalog75 and held-camera lifecycle
        working-directory: frontend
        run: npx playwright test -c playwright.vision.config.ts 2>&1 | tee ../.vision-evidence/browser-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-web-evidence
          path: |
            .vision-evidence/
            frontend/test-results/
          include-hidden-files: true
          retention-days: 7

  bodyparts3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact source-pinned BodyParts3D reference atlas
        working-directory: frontend
        run: sh scripts/build-bodyparts3d.sh "$RUNNER_TEMP/bodyparts3d"
      - name: Validate geometry, credits and relative asset paths
        working-directory: frontend
        run: node scripts/check-bodyparts3d-build.mjs "$RUNNER_TEMP/bodyparts3d/dist"
      - name: Archive small provenance report, never full meshes
        if: always()
        run: |
          mkdir -p .vision-bp3d-evidence
          git rev-parse HEAD > .vision-bp3d-evidence/ora-commit.txt
          if [ -f "$RUNNER_TEMP/bodyparts3d/dist/ora-integrated.json" ]; then
            cp "$RUNNER_TEMP/bodyparts3d/dist/ora-integrated.json" .vision-bp3d-evidence/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-bodyparts3d-provenance
          path: .vision-bp3d-evidence/
          include-hidden-files: true
          retention-days: 7
