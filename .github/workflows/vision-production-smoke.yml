name: Vision one-shot deployed smoke
on:
  push:
    branches: [qa/vision-live-check-20261011]
    paths:
      - '.github/workflows/vision-production-smoke.yml'
      - 'scripts/vision_production_smoke.py'
      - 'scripts/vision_public_photo_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-one-shot-production
  cancel-in-progress: false
jobs:
  deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke tools
        run: python -m pip install 'httpx==0.28.1' 'pillow==12.3.0' 'playwright==1.54.0'
      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium
      - name: Test authorized deployment with real API and provider
        run: python scripts/vision_public_photo_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-deployed-evidence
          path: .vision-production-evidence/
          include-hidden-files: true
          retention-days: 7
