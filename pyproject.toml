[project]
name = "dangerok"
version = "0.1.0"
description = "Assistente privato per controlli e verifiche fiscali (Circolare 1/2018 GdF)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]", "sqlalchemy>=2", "jinja2", "python-multipart", "itsdangerous",
  "pyotp", "argon2-cffi", "cryptography", "python-docx", "anthropic>=1.9", "qrcode",
]
[project.optional-dependencies]
dev = ["pytest", "httpx"]
postgres = ["psycopg[binary]"]
[tool.pytest.ini_options]
testpaths = ["tests"]
