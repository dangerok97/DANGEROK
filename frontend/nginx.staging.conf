server {
    error_log /dev/stdout warn;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The embedded atlas runs in a script-only sandbox with an opaque origin.
    # Wildcard CORS applies ONLY to public, non-personal 3D reference files.
    location ^~ /bodyparts3d/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
