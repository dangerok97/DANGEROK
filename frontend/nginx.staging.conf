server {
    error_log /dev/stdout warn;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The embedded atlas runs in a script-only sandbox with an opaque origin.
    # Wildcard CORS applies ONLY to public, non-personal 3D reference files.
    # Cache only the pinned static BodyParts3D reference (no personal media).
    location ^~ /bodyparts3d/models/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /bodyparts3d/assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ^~ /bodyparts3d/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    # The notification worker must always be revalidated, or a fix to it
    # would reach phones only whenever the browser felt like checking.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
