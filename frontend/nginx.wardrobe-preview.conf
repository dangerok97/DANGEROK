# This preview is not the production app. Use only fresh, disposable test data.
# Only a login through /pilot-unlock can mint a short-lived HttpOnly gate cookie.
# Runtime-only gate uses a long unguessable key; the default 64-byte map bucket is too small.
map_hash_bucket_size 128;
map $cookie_ora_pilot_access $pilot_auth_ok {
    default 0;
    "__PILOT_COOKIE_TOKEN__" 1;
}
server {
    listen 8080;
    server_name _;
    resolver __PILOT_DNS__ valid=15s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    # Health check contains no project or account information.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Separate HTTP Basic prompt only here; the API's Bearer token is never
    # overridden with Basic Authorization by the browser.
    location = /pilot-unlock {
        access_log off;
        auth_basic "ORA isolated pilot";
        auth_basic_user_file /etc/nginx/.pilot-htpasswd;
        add_header Set-Cookie "ora_pilot_access=__PILOT_COOKIE_TOKEN__; Path=/; Max-Age=3600; HttpOnly; Secure; SameSite=Strict" always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
        alias /usr/share/nginx/html/pilot-unlock.html;
    }

    location ^~ /api/ {
        access_log off;
        if ($pilot_auth_ok = 0) { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # Resolve at request time: the backend may not have an internal DNS
        # record when this container starts for the first time.
        set $wardrobe_backend pilot-backend-351.railway.internal:8080;
        proxy_pass http://$wardrobe_backend;
    }

    location ^~ /bodyparts3d/ {
        if ($pilot_auth_ok = 0) { return 403; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    location / {
        if ($pilot_auth_ok = 0) { return 403; }
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
